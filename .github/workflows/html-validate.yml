name: Validación de HTML sobre golden files

# Issue #13: los bugs estructurales del generador de slidelang (<div>
# desbalanceados, IDs duplicados, <p><h3> inválido — ver issue #12, ya
# cerrado) son exactamente el tipo de defecto que un validador HTML
# determinista atrapa. Este job genera el HTML de todos los ejemplos
# .slidelang del repo y lo valida contra html-validate, para que una
# regresión del generador falle el build de CI en vez de descubrirse
# como "el viewer renderiza raro" río abajo.
#
# Issue #173: el mismo defecto existía en el generador de doclang
# (document_html.go, que comparte los renderers de elemento de
# renderer/html.go con slidelang) — 195 errores reales de html-validate
# (element-permitted-content, close-order, void-style,
# no-implicit-button-type, wcag/h63, no-trailing-whitespace) sobre las 20
# fixtures .doclang, nunca atrapados porque este job solo cubría
# .slidelang. El job doclang-html-validate de abajo espeja el mismo
# patrón para que una regresión futura del lado doclang falle CI igual
# que ya pasa del lado slidelang.
#
# Los dos jobs de HTML corren en matriz sobre `deps`, y ese eje es el punto
# más importante de este workflow. Con `published`, `go build` dentro de
# slidelang/ o doclang/ resuelve `go.ziradocs.com/core/v2` desde el proxy —
# es lo que recibe quien instala las CLIs, y hay que seguir validándolo. Pero
# eso significa que un PR que SOLO toca core/ se validaba contra una core que
# no contenía su propio cambio: el job daba verde sin haber ejecutado una
# línea del código en revisión. La pata `workspace` escribe un go.work en la
# raíz antes de compilar, así que valida el árbol de trabajo completo.
#
# Es el mismo hueco que ci.yml ya documenta y cierra para build-test con el
# job workspace-integration; ver ahí el razonamiento largo. Este workflow
# nunca adoptó ese patrón, así que la única señal que tenía sobre el HTML de
# un PR de core venía de una dependencia que no lo contenía.
#
# Esto no es teórico. Con la serie del issue #194 (encabezados de subsección
# en flex) la pata publicada daba verde y la de workspace 33 errores: 31 ids
# derivados que empiezan por dígito, un id duplicado, y un <img src=""> que
# ya estaba en main desde #252 y que solo iba a aparecer en el próximo bump.
#
# Las dos patas son gates: la publicada representa la instalación real y la
# de workspace, la consistencia del árbol consigo mismo. fail-fast: false
# para poder ver de un vistazo si un fallo es de una o de las dos, que es lo
# que dice si el problema entra ahora o en el próximo bump.
#
# Issue #163/#167 follow-up: ninguno de los dos jobs de arriba atrapa una
# imagen LOCAL rota (`![x](assets/no-existe.png)`) — el build no falla por
# eso, solo emite un <img> cuyo src nunca resuelve, y html-validate no
# valida que un src exista en disco. El job example-assets de abajo es un
# chequeo estático aparte (scripts/check-example-assets.py, sin Go/Node,
# corre en segundos) contra ESE hueco específico.

on:
  pull_request:
    paths:
      - "core/**"
      - "!core/cmd/**"
      - "slidelang/**"
      - "!slidelang/internal/serializer/**"
      - "doclang/**"
      - "examples/**"
      - "scripts/check-example-assets.py"
      - "scripts/check-example-assets-baseline.txt"
      - ".htmlvalidate.json"
      - ".github/workflows/html-validate.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "!core/cmd/**"
      - "slidelang/**"
      - "!slidelang/internal/serializer/**"
      - "doclang/**"
      - "examples/**"
      - "scripts/check-example-assets.py"
      - "scripts/check-example-assets-baseline.txt"
      - ".htmlvalidate.json"
      - ".github/workflows/html-validate.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  html-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        deps: [published, workspace]
    name: html-validate (${{ matrix.deps }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar html-validate
        run: npm install --no-save html-validate@11

      - name: Usar el core del árbol de trabajo
        if: matrix.deps == 'workspace'
        run: printf 'go 1.26.5\n\nuse (\n\t./core\n\t./doclang\n\t./slidelang\n)\n' > go.work

      - name: Build de la CLI slidelang
        working-directory: slidelang
        run: go build -o /tmp/slidelang ./cmd/slidelang

      - name: Generar HTML de todos los ejemplos .slidelang
        run: |
          mkdir -p /tmp/html-validate-out
          skipped=0
          built=0
          while IFS= read -r -d '' f; do
            base=$(basename "$f" .slidelang)
            if /tmp/slidelang build "$f" --format html --output "/tmp/html-validate-out/${base}" > /dev/null 2>&1; then
              built=$((built+1))
            else
              # Build/lint failures pre-existentes en algunos fixtures (issue #95)
              # no son el foco de este gate — se listan pero no bloquean el job,
              # igual que el "|| continue" ya establecido en schema-drift.yml.
              echo "::warning::No se pudo generar HTML para $f (build/lint falló) — omitido de la validación HTML, ver issue #95"
              skipped=$((skipped+1))
            fi
          done < <(find examples -name '*.slidelang' -print0)
          echo "Generados: $built, omitidos: $skipped"

      - name: Validar HTML generado
        run: npx html-validate --config="${{ github.workspace }}/.htmlvalidate.json" "/tmp/html-validate-out/**/*.html"

  doclang-html-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        deps: [published, workspace]
    name: doclang-html-validate (${{ matrix.deps }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar html-validate
        run: npm install --no-save html-validate@11

      - name: Usar el core del árbol de trabajo
        if: matrix.deps == 'workspace'
        run: printf 'go 1.26.5\n\nuse (\n\t./core\n\t./doclang\n\t./slidelang\n)\n' > go.work

      - name: Build de la CLI doclang
        working-directory: doclang
        run: go build -o /tmp/doclang ./cmd/doclang

      - name: Generar HTML de todos los ejemplos .doclang
        run: |
          mkdir -p /tmp/doclang-html-validate-out
          skipped=0
          built=0
          while IFS= read -r -d '' f; do
            base=$(basename "$f" .doclang)
            if /tmp/doclang build "$f" --format html --output "/tmp/doclang-html-validate-out/${base}" > /dev/null 2>&1; then
              built=$((built+1))
            else
              echo "::warning::No se pudo generar HTML para $f (build falló) — omitido de la validación HTML"
              skipped=$((skipped+1))
            fi
          done < <(find examples -name '*.doclang' -print0)
          echo "Generados: $built, omitidos: $skipped"

      - name: Validar HTML generado
        run: npx html-validate --config="${{ github.workspace }}/.htmlvalidate.json" "/tmp/doclang-html-validate-out/**/*.html"

  example-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar que las imágenes locales referenciadas en examples/ existan
        run: python3 scripts/check-example-assets.py
