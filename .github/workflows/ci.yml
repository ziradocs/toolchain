name: CI

# Issue #43: el repo no tenía ningún gate de build/vet/test para el código Go
# — solo html-validate.yml (genera HTML de los ejemplos) y schema-drift.yml
# (regenera el contrato JSON/AST) ejercitaban el código indirectamente. Este
# workflow corre build+vet+test+lint por cada uno de los 3 módulos Go
# independientes del monorepo (sin go.work — cada uno se compila por separado,
# igual que documenta CLAUDE.md) en cada PR y en push a main.
#
# Los dos modos de resolución de `core` atrapan fallas OPUESTAS, así que se
# corren los dos: `build-test`/`lint` resuelven el core PUBLICADO (como un
# `go install` externo) y `workspace-integration` resuelve el core DEL ÁRBOL
# (como el go.work de desarrollo local). Ver el comentario de ese job.

on:
  pull_request:
    paths:
      - "core/**"
      - "slidelang/**"
      - "doclang/**"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "slidelang/**"
      - "doclang/**"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"

# Un push nuevo vuelve obsoletos los resultados del commit anterior de la
# misma rama/PR. Cancelarlo evita pagar matrices completas que ya no sirven.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Los tres módulos declaran el mismo piso de Go. Un solo runner evita
      # repetir checkout/setup y, sobre todo, tres redondeos de facturación.
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Build, vet y test de los módulos Go
        run: |
          set -euo pipefail
          for module in core slidelang doclang; do
            echo "::group::$module"
            (cd "$module" && go build ./... && go vet ./... && go test ./...)
            echo "::endgroup::"
          done

  # `build-test` compila los consumidores contra el core PUBLICADO — el
  # checkout de CI no tiene go.work, así que slidelang/doclang resuelven el
  # `require go.ziradocs.com/core/v2` de su go.mod desde el proxy. Eso simula
  # fielmente un `go install` externo y atrapa "el consumidor necesita un core
  # que todavía no se publica".
  #
  # Lo que NO atrapa es la falla inversa: un PR solo-de-core que cambia o
  # borra un símbolo que slidelang/doclang usan se mergea VERDE, porque los
  # consumidores siguen compilando contra el core publicado, que todavía tiene
  # el símbolo viejo. Esa rotura aparecía hasta scripts/bump-core.sh paso 7,
  # o sea después de que el paso 4 ya pusheó el tag — y un tag que
  # proxy.golang.org/sum.golang.org ya indexaron es permanente en la práctica
  # (ver CLAUDE.md sobre core/v2.1.0).
  #
  # Este job cierra ese hueco: compila y testea los consumidores contra el
  # core del árbol, vía un go.work efímero (go.work/go.work.sum están
  # gitignoreados y `go` escribe el .sum solo; no hay nada que commitear). Es
  # ADITIVO — el gate que representa la instalación real sigue siendo
  # build-test, este solo agrega la dirección que le faltaba.
  #
  # Nota para los PRs de scripts/bump-core.sh (solo go.mod/go.sum): en modo
  # workspace la línea `require` es irrelevante — el workspace la sobreescribe
  # con el core del árbol —, así que este job pasa trivialmente y no valida
  # nada del bump. Quien verifica un bump es build-test, no este job.
  #
  # Nota para cambios NO aditivos en core (cambiar una firma, no agregarla):
  # con los dos gates prendidos, ese cambio no se puede mergear ni junto con
  # el del consumidor (rompe build-test) ni por separado (rompe este job). El
  # camino es el de siempre — agregar el símbolo nuevo, migrar a los
  # consumidores, borrar el viejo, en PRs separados.
  #
  # Ojo con el porqué, porque es fácil contarlo mal: NO es que SemVer lo
  # exija. core/doc.go es explícito en que, fuera de cli.Options y del schema
  # del AST serializado, la API Go de core no tiene garantías de SemVer y
  # puede cambiar en versiones menores. La razón real es empírica: en este
  # repo los cambios de core son casi siempre aditivos (seams, reglas nuevas,
  # fixes), así que la disciplina de tres PRs se paga pocas veces y a cambio
  # `main` queda siempre instalable Y siempre consistente consigo mismo.
  # Si eso deja de ser cierto, el arreglo es partir build-test en
  # core/consumidores y saltarse la parte de consumidores con una etiqueta
  # explícita en el PR — pero no hace falta montarlo antes de que duela.
  workspace-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # go-version-file: mismo criterio que en build-test arriba.
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Build y test de los consumidores contra el core del árbol
        run: |
          set -euo pipefail
          go work init ./core ./slidelang ./doclang
          for module in slidelang doclang; do
            echo "::group::$module (workspace)"
            (cd "$module" && go build ./... && go test ./...)
            echo "::endgroup::"
          done

  lint:
    strategy:
      fail-fast: false
      matrix:
        module: [core, slidelang, doclang]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — only-new-issues (abajo) necesita el historial completo
      # para diffear contra la rama base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # go-version-file: mismo criterio que en build-test arriba.
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      # Set mínimo inicial (govet/errcheck/staticcheck, ver .golangci.yml).
      # only-new-issues: solo bloquea sobre código nuevo/tocado — el repo tiene
      # ~30 hallazgos pre-existentes (WriteString+Sprintf, errcheck en Close/
      # Write, etc.) que no son el foco de este PR de infraestructura; se
      # catalogan y limpian en un batch de cleanup dedicado, no acá (issue
      # de tracking creado). golangci-lint-action@v6 NO soporta golangci-lint
      # v2 (falla explícitamente con "you must update to golangci-lint-action
      # v7") — confirmado en CI, no es un detalle menor. Pineado en @v9 desde
      # PR #9; el probe de Fase 0 (issue de release v2.2.3) confirmó
      # empíricamente que only-new-issues sigue gateando bajo v9 en este
      # layout de monorepo (working-directory por módulo) antes de mergear.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml
          only-new-issues: true
