packages:
  - path: "go.ziradocs.com/core/v2/diagnostics"
    output_path: "../ast-types/src/generated/diagnostics.ts"
  - path: "go.ziradocs.com/core/v2/ast"
    output_path: "../ast-types/src/generated/ast.ts"
    type_mappings:
      diagnostics.Position: "Position"
      # Element is a Go interface; tygo can't enumerate its implementers via
      # static reflection, so it's pinned here as a discriminated union
      # (must stay in sync with "func (X) element() {}" in ast/*.go, the
      # same list core/cmd/gen-schema uses).
      ast.Element: "TextElement | PointsElement | CodeElement | ImageElement | TableElement | SpecialBlockElement | CodeGroupElement | MermaidElement | PlantUMLElement | ChartElement | MapElement | QuoteElement | ChecklistElement | GridElement | ColumnElement | DirectiveNode | MathElement | MediaElement"
